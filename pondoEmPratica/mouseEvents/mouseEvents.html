<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos do Mouse</title>
    <link rel="stylesheet" href="mouseEvents.css">
</head>
<body>
    
    <h1>Teste os eventos do mouse 🖱️</h1>
    <p>Interaja com o bloco abaixo para testar os eventos de mouse via JavaScript.</p>

    <div class="layout">
        <div id="areaTeste">
            <span id="texto-principal">Passe o mouse aqui!</span>
        </div>

        <div class="caixaLateral">
            <h3>Nome dos eventos</h3>
            <div class="evento" id="idmouseenter">mouseenter</div>
            <div class="evento" id="idmouseout">mouseout</div>
            <div class="evento" id="idclick">click</div>
            <div class="evento" id="iddblclick">dblclick</div>
        </div>
    </div>
    

    <script src="mouseEvents.js"></script>
</body>
</html>
